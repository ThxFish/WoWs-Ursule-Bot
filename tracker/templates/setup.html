{% extends "base.html" %}{% block title %}首次设置{% endblock %}
{% block content %}<section class="auth-card"><p class="eyebrow">首次启动</p><h1>建立你的本地跟踪器</h1><p class="muted">密码只保护本机面板。账号密码不会被保存。</p>
<form method="post" class="stack">
  <label>管理员密码（至少 10 位）<input name="password" type="password" minlength="10" required></label>
  <label>欧服 Account ID<input name="account_id" inputmode="numeric" placeholder="可稍后填写"></label>
  <label>Wargaming Application ID<input name="wg_application_id" type="password" placeholder="可稍后填写"></label>
  <button>完成初始化</button>
</form></section>{% endblock %}
