<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}节日船团跟踪器{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='resources.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">⚓ 节日船团跟踪器 <span>MVP</span></a>
    <nav>
      <a href="/">总览</a><a href="/goals">奖励与资源</a><a href="/plan">重爬时间轴</a><a href="/history">历史</a><a href="/settings">设置</a>
    </nav>
    {% if csrf %}<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">退出</button></form>{% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>数据仅用于个人进度规划；不会自动执行游戏内操作。</footer>
</body>
</html>
