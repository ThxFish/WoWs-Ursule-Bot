services:
  app:
    build:
      context: .
    image: wows-marathon-tracker:0.1.0
    restart: unless-stopped
    init: true
    shm_size: 1gb
    env_file:
      - .env
    environment:
      TRACKER_DATA_DIR: /data
      TRACKER_HOST: 0.0.0.0
      TRACKER_PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

