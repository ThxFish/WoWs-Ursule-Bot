<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Ursule Bot{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/pages.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/resources.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/snapshots.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/mobile.css') }}">
  <script src="{{ url_for('static', path='js/htmx.min.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">U</span><span>Ursule Bot<small>WoWS PERSONAL ASSISTANT</small></span></a>
    <nav aria-label="主要导航">
      <a class="{{ 'active' if active_nav == 'dashboard' else '' }}" href="/">总览</a>
      <a class="{{ 'active' if active_nav == 'planning' else '' }}" href="/planning">活动规划</a>
      <a class="{{ 'active' if active_nav == 'stats' else '' }}" href="/stats">战绩</a>
      <a class="{{ 'active' if active_nav == 'information' else '' }}" href="/information">信息</a>
      <a class="{{ 'active' if active_nav == 'settings' else '' }}" href="/settings">设置</a>
    </nav>
    {% if csrf %}<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">退出</button></form>{% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Ursule Bot 仅采集、计算与提醒，不会执行任何游戏内资产操作。</footer>
</body>
</html>
