[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wows-marathon-tracker"
version = "0.1.0"
description = "World of Warships Holiday Convoy progress tracker"
requires-python = ">=3.12"
dependencies = [
  "apscheduler==3.11.0",
  "argon2-cffi==23.1.0",
  "cryptography==45.0.6",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "playwright==1.54.0",
  "python-multipart==0.0.20",
  "qq-botpy==1.2.1",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.1.0"]

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
